// HIPPO MENU config
// Run once from the in-game console (~):  exec hippo_menu.cfg
// If exec cannot find the file, paste these lines into the console instead.

// Key names (used by the script for its own bind attempt and for the on-screen hints)
set hippo_key_open "9"
set hippo_key_up "UPARROW"
set hippo_key_down "DOWNARROW"
set hippo_key_select "ENTER"
set hippo_key_back "BACKSPACE"

// 1 = animated menu, 0 = instant
set hippo_animations "1"

// 0 = menu on the left, 1 = menu on the right
set hippo_side "0"

// Look: theme 0-6 (ice, toxic, crimson, royal, gold, rainbow, kush), emblem 0-10 (prestige icon, 10 = off)
// These are also changed from the menu: Appearance > Theme / Emblem
set hippo_theme "0"
set hippo_emblem "0"

// Textures (gradients + prestige emblems). If the game ever errors while loading the map
// after an update, turn them off with:  set hippo_textures "0"
set hippo_textures "1"

// Kush theme icon (cardicon_weed). If the map ever fails to load because of it, set this to 0
// and the theme falls back to a drawn leaf:  set hippo_weedicon "0"
set hippo_weedicon "1"

// Kush theme in-game overlay (glowing icon + HIPPO bottom-left). 1 = on, 0 = off.
// Also in the menu: Appearance > Kush HUD
set hippo_kushhud "1"

// Extra object models for Objects > Object (space-separated model names, advanced).
// They are loaded when the map starts, so a wrong name can stop the map from loading.
// Leave empty if unsure. Example: set hippo_models "model_one model_two"
set hippo_models ""

// Field of view / third person. The game does not let scripts change these on IW4x, but these
// console commands always work. Remove the // in front to apply them every time you run this file.
//cg_fov 90
//sv_cheats 1
//cg_thirdperson 1

// Vehicles in the Objects list (harrier, B-2, AC130, tank wreck...) are loaded when the map starts.
// If a map ever fails to load because of them, set this to 0:  set hippo_globalmodels "0"
set hippo_globalmodels "1"

// Menu click sound when moving through the menu. 0 = off (default), 1 = on
set hippo_sounds "0"

// Key binds. If you change a key above, change it here too.
bind 9 "+hippo_toggle"
bind UPARROW "+hippo_up"
bind DOWNARROW "+hippo_down"
bind ENTER "+hippo_select"
bind BACKSPACE "+hippo_back"
